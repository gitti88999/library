name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
      - server-tests
  workflow_dispatch:

jobs:

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./server/*.csproj

      - name: Build
        run: dotnet build ./server/*.csproj --no-restore

      - name: Test
        run: dotnet test ./server/*.csproj --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install
        working-directory: ./client

      - name: Build
        run: npm run build
        working-directory: ./client


  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build backend image
        run: docker build -t server-image ./server

      - name: Build frontend image
        run: docker build -t client-image ./client