version: "3.9"

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: libraryDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libraryDB"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5217:5217"
    environment:
      ASPNETCORE_URLS: http://+:5217
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__libraryDB: "Host=aws-0-us-east-1.pooler.supabase.com;Port=6543;Database=libraryDB;Username=libraryDB.tbqiqjbnbjiogkatqkgs;Password=...;SSL Mode=Require;Trust Server Certificate=true;Pooling=true;Maximum Pool Size=1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pg_data: