version: "3.9"

services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ALTgit88999"
    ports:
      - "1434:1433" 
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: 
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S", "localhost",
          "-U", "sa",
          "-P", "ALTgit88999",
          "-C",
          "-Q", "SELECT 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5217:5217"
    environment:
      ASPNETCORE_URLS: http://+:5217
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__libraryDB: "Server=db,1433;Database=libraryDB;User Id=sa;Password=ALTgit88999;TrustServerCertificate=true;MultipleActiveResultSets=true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL}"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sql_data: